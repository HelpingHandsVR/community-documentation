name: "Build documentation"

on:
  push:
    branches:
      - source
  workflow_dispatch: {}

jobs:
  build_manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Typst
        uses: typst-community/setup-typst@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Python requirements
        run: |
          pip install -U -r requirements.txt

      - name: Transfer manifests to deploy branch
        shell: bash
        run: |
          # Copy the manifests to a temporary directory
          export MANIFESTS_TEMP=$(mktemp -d)
          cp -r output/* $MANIFESTS_TEMP

          # Clear the repo so we can switch branches
          git clean -dfx

          # Switch branches to deploy
          git fetch origin deploy
          git checkout deploy

          # If the last commit was by GitHub Actions, revert it
          if [[ "$(git show -s --format='%ae' HEAD)" == *"github-actions"* ]]; then
            git reset --hard HEAD^;
          fi

          # Copy artifacts here
          cp -r ${MANIFESTS_TEMP}/* .

          # Upload the manifest
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "Autogenerated documentation created at $(date +%Y-%m-%d_%H-%M)"
          git push --force
